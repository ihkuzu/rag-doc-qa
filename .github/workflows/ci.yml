name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Index the sample documents
        run: docker compose exec -T api python -m ragqa ingest data/sample
      - name: Check the API
        run: |
          curl --fail --silent localhost:8100/health
          echo
          docker compose exec -T api python -m ragqa search "how many vacation days do employees get" -k 1
      - name: Run the evaluation
        run: docker compose exec -T api python -m ragqa eval data/eval/questions.json -k 5
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
